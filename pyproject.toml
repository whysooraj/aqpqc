[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqpqc"
version = "0.1.0"
description = "Adaptive Quantum Intelligence Framework for Context-Aware Post-Quantum Cryptographic Algorithm Selection"
authors = [
    {name = "Mouli Sai Santhosh Sooraj Makala"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "psutil>=5.9.0"
]

[project.scripts]
aqpqc = "aqpqc.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
